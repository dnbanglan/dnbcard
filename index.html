    <!-- Global window.fetch shim: provides getter and setter so devtools/extensions/iframes never throw TypeError: Cannot set property fetch of #<Window> which has only a getter -->
    <script>
      (function() {
        try {
          var _globalFetch = window.fetch;
          var desc = {
            get: function() {
              return _globalFetch;
            },
            set: function(fn) {
              _globalFetch = fn;
            },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(window, 'fetch', desc);
          } catch (e1) {}
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', desc);
            }
          } catch (e2) {}
        } catch (e) {
          console.warn('Fetch property shim notice:', e);
        }
      })();
    </script>
